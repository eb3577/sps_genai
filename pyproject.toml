[project]
name = "sps-genai"
version = "0.1.0"
description = "Project 1 submission. Added endpoint for word embeddings."
readme = "README.md"
authors = [
    { name = "Erik Bird", email = "eb3577@columbia.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "en-core-web-lg",
    "fastapi[standard]>=0.141.1",
    "jupyter>=1.1.1",
    "pydantic>=2.13.5",
    "spacy>=3.8.16",
    "torch>=2.14.0",
]

[project.scripts]
sps-genai = "sps_genai:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
